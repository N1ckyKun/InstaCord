<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
    </head>
    <body>
        <b class="nav">InstaCord</b>
        <a class="nav" href="/register">Register</a>
        <div class = "forms">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                        <p>{{msg}}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form action="#" method="post">
                <h1>Login</h1>
                <input type="text" name="nm" placeholder="Name"/><br>
                <input type="text" name="pswd" placeholder="Password"/><br>
                <input type="submit" value="submit"/>
            </form>
        </div>
    </body>
</html>
