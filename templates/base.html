<!DOCTYPE html>
<html>
    <head>
        <title>Instacord | {% block title %}{% endblock %}</title>
        <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
        <script src="{{url_for('static', filename='app.js')}}" defer></script>
    </head>
    <body>
        <div class="nav">
            <a class='button topleft' href="/account/{{selfdata()[0]}}">
                <img class='smallavatar' src="{{selfdata()[1]}}" alt="pfp">
                <span>{{selfdata()[0]}}</span>
            </a>
            <a class="button" href="/">Home</a>
            <a class="button" href="/post">Create Moment</a>
            <a class="button" href="/userlist">Users</a><br>
            <a class="button" href="/logout">Logout</a><br>
        </div>
        <div class="vignette">
            <div class="body">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </body>
</html>
