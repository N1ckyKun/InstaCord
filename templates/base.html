<!DOCTYPE html>
<html>
    <head>
        <title>Instacord | {% block title %}{% endblock %}</title>
        <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
        <script src="{{url_for('static', filename='app.js')}}" defer></script>
    </head>
    <body>
        <div class="nav">
            <span class="nav">
                <a class='button topleft' href="/account/{{selfdata()[1]}}">
                    <img class='smallavatar' src="{{selfdata()[4]}}" alt="pfp">
                    {{selfdata()[1]}}
                </a>
                <a class="button" href="/">Home</a>
                <a class="button" href="/post">Create Moment</a>
                <a class="button" href="/userlist">Users</a>
            </span> 
            <span class="nav">
                <a class="button" href="/notis">Notifications</a>
                {% if selfdata()[6] == 1 %}
                    <a class="button" href="/reports">Reports</a>
                {% endif %}
                <a class="button" href="/logout">Logout</a>
            </span>
        </div>
        <div class="vignette">
            <div class="body">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </body>
</html>
