{% extends "base.html" %}
{% from "macros.html" import user_badge %}
{% block title %}Report {{shortinfo[0]}}{% endblock %}
{% block content %}
<div class="post" style="width:510px;">
    <div class="forms" style="margin-bottom: 5px;">
        <h1>Reporting</h1>{{user_badge(shortinfo,"small")}}
        <form action="#" method="post">
            <h2>Reason:</h2>
            <span>
                <input type="radio" name="reason" value="Post" required/>
                <label for="html">Problematic Post</label><br>
            </span><span>
                <input type="radio" name="reason" value="Comment" required/>
                <label for="html">Problematic Comment</label><br>
            </span><span>
                <input type="radio" name="reason" value="Profile" required/>
                <label for="html">Problematic Profile</label><br>
            </span><span>
                <input type="radio" name="reason" value="Spam" required/>
                <label for="html">Spam</label><br>
            </span>
            <h3>Give us the details</h3>
            <input type="text" name="details" required/><br>
            <input type="submit" value="submit" style="border-radius:15px;"/>
        </form>
    </div>
</div>
{% endblock %}
