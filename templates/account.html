{% extends "base.html" %}
{% block title %}{{info[1]}}'s profile{% endblock %}
{% block content %}
<div class="profile">
    <img src="{{info[4]}}" alt="avatar">
    <b class="profile">{{info[1]}}</b>
</div>
<div class="profilebuttons">
    <a style="color: red" class="button" href="">Report User</a>
    <a class="button" href="">Follow User</a>
</div>
<hr>
{% for p in posts %}
    <div class="post">
        <img class='post' src="{{p[0]}}" alt="{{p[1]}}">
        <p class="post">{{p[2]}}</p>
    </div>
{% endfor %}
{% endblock %}
