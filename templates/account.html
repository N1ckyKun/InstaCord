{% extends "base.html" %}
{% from "macros.html" import render_post %}
{% block title %}{{info[0][1]}}{% endblock %}
{% block content %}
<div class="profile">
    <img class='acc' src="{{info[0][4]}}" alt="avatar">
    <span class="proftag">
        <span class="profile">{{info[0][1]}} </span>
        <span class='tag' style="background-color: {{info[2][1]}}">{{info[2][0]}}</span>
    </span>
    <span id="count{{info[0][0]}}">{{info[1][0]}} Followers</span>
</div>
<div class="profilebuttons">
    <a style="color: red" class="button" href="">Report User</a>
    <button id="button{{info[0][0]}}" class="profile" onclick="followUser('{{info[0][0]}}')">
        {{ "Following" if info[1][1] else "Follow User" }}
    </button>
</div>
<hr><br><br><br>
{% for p in posts %}
    {{ render_post(p, False, False) }}
{% endfor %}
{% endblock %}
