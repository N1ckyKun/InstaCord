{% extends "base.html" %}
{% block title %}Home Page{% endblock %}
{% block content %}
<h1>Home Page</h1>
{% for p in posts %}
    <div class="post">
        <a class = 'acc' href="/account/{{p[0]}}">
            <img class='acc' src="{{p[5]}}" alt="pfp">
            <span class="acc">{{p[0]}}</span>
        </a>
        <img class='post' src="{{p[1]}}" alt="{{p[2]}}">
        <p class="post">{{p[3]}}</p>
    </div>
{% endfor %}
{% endblock %}
