{% extends "base.html" %}
{% block title %}Home Page{% endblock %}
{% block content %}
<h1>Home Page</h1>
{% for p in posts %}
    <div class="post">
        <div class="header">
            <a class = 'acc' href="/account/{{p[1]}}">
                <img class='avatar' src="{{p[2]}}" alt="pfp">
                <span class="acc">{{p[1]}}</span>
            </a>
            <button class="post" id="{{p[0]}}" data-postid="{{p[0]}}" onclick="updateLike('{{p[0]}}')" type="button">
                {{ "❤️" if p[7] else "🤍" }} {{p[6]}}
            </button>
        </div>
        <img class='post' src="{{p[3]}}" alt="Moment">
        <p class="post">{{p[4]}}</p>
        <span class="post">created at {{p[5]}}</span>
    </div>
{% endfor %}
{% endblock %}
