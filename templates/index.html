{% extends "base.html" %}
{% block title %}Home Page{% endblock %}
{% block content %}
<h1>Home Page</h1>
{% for p in posts %}
    <div class="post">
        <div class="header">
            <a class = 'acc' href="/account/{{p[0]}}">
                <img class='avatar' src="{{p[5]}}" alt="pfp">
                <span class="acc">{{p[0]}}</span>
            </a>
            <button id="{{p[6]}}" data-postid="{{p[6]}}" onclick="updateLike('{{p[6]}}')" type="button">
                {{ "❤️" if p[8] else "🤍" }} {{p[7]}}
            </button>
        </div>
        <img class='post' src="{{p[1]}}" alt="{{p[2]}}">
        <p class="post">{{p[3]}}</p>
        <span class="post">created at {{p[4]}}</span>
    </div>
{% endfor %}
{% endblock %}
