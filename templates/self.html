{% extends "base.html" %}
{% block title %}{{info[1]}}'s profile{% endblock %}
{% block content %}
<div class="profile">
    <img class='acc' src="{{info[4]}}" alt="avatar">
    <span><b class="profile">{{info[1]}}</b>(You)</span>
    <span id="count{{info[0]}}">{{info[5]}} Followers</span>
</div>
<div class="profilebuttons">
    <a class="button" href="/username">Change Username</a>
    <a class="button" href="/avatar">Change Avatar</a>
    <a class="button" href="/email">Change Email</a>
    <a class="button" href="/password">Change Password</a>
    <a style="color: red" class="button" href="/delete">Delete Account</a>
</div>
<hr>
{% for p in posts %}
    <div id="post{{p[0]}}" class="post">
        <div class="header">
            <button class="post" id="del{{p[0]}}" onclick="deletePost('{{p[0]}}')" type="button">
                Delete
            </button>
            <button class="post" id="{{p[0]}}" onclick="updateLike('{{p[0]}}')" type="button">
                {{ "❤️" if p[7] else "🤍" }} {{p[6]}}
            </button>
        </div>
        <img class='post' src="{{p[3]}}" alt="Moment">
        <p class="post">{{p[4]}}</p>
        <span class="post">created at {{p[5]}}</span>
    </div>
{% endfor %}
{% endblock %}
