{% extends "base.html" %}
{% block title %}{{info[1]}}'s profile{% endblock %}
{% block content %}
<div class="profile">
    <img src="{{info[4]}}" alt="avatar">
    <b class="profile">{{info[1]}}</b>
    <span>(You)</span>
</div>
<div class="profilebuttons">
    <a class="button" href="/username">Change Username</a>
    <a class="button" href="/avatar">Change Avatar</a>
    <a class="button" href="/email">Change Email</a>
    <a class="button" href="/password">Change Password</a>
    <a style="color: red" class="button" href="/delete">Delete Account</a>
</div>
<hr>
{% for p in posts %}
    <div class="post">
        <img class='post' src="{{p[0]}}" alt="{{p[1]}}">
        <p class="post">{{p[2]}}</p>
    </div>
{% endfor %}
{% endblock %}
