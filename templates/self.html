{% extends "base.html" %}
{% block title %}{{info[1]}}'s profile{% endblock %}
{% block content %}
<div class="profile">
    <img class='acc' src="{{info[4]}}" alt="avatar">
    <b class="profile">{{info[1]}}</b>
    <span>(You)</span>
</div>
<div class="profilebuttons">
    <a class="button" href="/username">Change Username</a>
    <a class="button" href="/avatar">Change Avatar</a>
    <a class="button" href="/email">Change Email</a>
    <a class="button" href="/password">Change Password</a>
    <a style="color: red" class="button" href="/delete">Delete Account</a>
</div>
<hr>
{% for p in posts %}
    <div id="post{{p[4]}}" class="post">
        <div class="header">
            <button id="del{{p[4]}}" data-postid="{{p[4]}}" onclick="deletePost('{{p[4]}}')" type="button">
                Delete
            </button>
            <button id="{{p[4]}}" data-postid="{{p[4]}}" onclick="updateLike('{{p[4]}}')" type="button">
                {{ "❤️" if p[6] else "🤍" }} {{p[5]}}
            </button>
        </div>
        <img class='post' src="{{p[0]}}" alt="{{p[1]}}">
        <p class="post">{{p[2]}}</p>
        <span class="post">created at {{p[3]}}</span>
    </div>
{% endfor %}
{% endblock %}
