{% extends "base.html" %}
{% block title %}Edit Avatar{% endblock %}
{% block content %}
<div class="forms">
    <br>
    <h1>Change Avatar</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <input id='input' onchange='update_preview()' type="file" name="avatar" accept="image/png, image/jpeg, image/webp" required/><br>
        <img class='acc forms' style='display: none;' id='preview' src="" alt="pfp">
        <input class='forms' type="submit" value="submit"/>
    </form>
</div>
{% endblock %}
